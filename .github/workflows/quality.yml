name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Check shell syntax
        run: sh -n image/build.sh image/tests/test_build.sh guest/caddy-policy/tests/test_policy.sh

      - name: Test image build wrapper
        run: image/tests/test_build.sh

      - name: Test Caddy policy package
        run: guest/caddy-policy/tests/test_policy.sh

      - name: Test NoCloud bootstrap
        run: python -m unittest discover -s guest/nocloud-bootstrap/tests -p 'test_*.py'

      - name: Test Proxmox network helper
        run: python -m unittest tofu/scripts/test_read_management_network.py
