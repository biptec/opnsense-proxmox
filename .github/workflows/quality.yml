name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install --yes bind9-utils

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.12.5'
          tofu_wrapper: false
          cache: true
          github_token: ${{ github.token }}

      - name: Install pinned OPNsense provider release
        env:
          PROVIDER_VERSION: '0.29.2'
          PROVIDER_SHA256: '837531c5abc785626d94bad48c0e61e3496e82d7d0643d4331956e77aa4ce9da'
          PROVIDER_MIRROR_DIR: ${{ runner.temp }}/provider-mirror
        run: |
          scripts/install-provider-release.sh
          cat > "${RUNNER_TEMP}/tofurc" <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "${PROVIDER_MIRROR_DIR}"
              include = ["biptec/opnsense"]
            }
            direct {
              exclude = ["biptec/opnsense"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=${RUNNER_TEMP}/tofurc" >> "${GITHUB_ENV}"

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

      - name: Check shell syntax
        run: sh -n image/build.sh image/tests/test_build.sh guest/caddy-policy/tests/test_policy.sh scripts/install-provider-release.sh platform/primary-router/scripts/import-singletons.sh

      - name: Test image build wrapper
        run: image/tests/test_build.sh

      - name: Test Caddy policy package
        run: guest/caddy-policy/tests/test_policy.sh

      - name: Test NoCloud bootstrap
        run: python -m unittest discover -s guest/nocloud-bootstrap/tests -p 'test_*.py'

      - name: Test Proxmox network helper
        run: python -m unittest tofu/scripts/test_read_management_network.py

      - name: Initialize VM bootstrap root
        run: tofu -chdir=tofu init -backend=false -input=false

      - name: Verify Etna bootstrap example
        run: platform/primary-router/scripts/verify-bootstrap-example.py

      - name: Test listener verifier
        run: python -m unittest scripts/test_verify_listeners.py

      - name: Test authoritative DNS verifier
        run: python -m unittest scripts/test_verify_dns.py

      - name: Initialize router foundation module
        run: tofu -chdir=modules/router-foundation init -backend=false -input=false

      - name: Test router foundation module
        run: tofu -chdir=modules/router-foundation test

      - name: Initialize router services module
        run: tofu -chdir=modules/router-services init -backend=false -input=false

      - name: Test router services module
        run: tofu -chdir=modules/router-services test

      - name: Initialize router egress module
        run: tofu -chdir=modules/router-egress init -backend=false -input=false

      - name: Test router egress module
        run: tofu -chdir=modules/router-egress test

      - name: Initialize primary router platform root
        run: tofu -chdir=platform/primary-router init -backend=false -input=false

      - name: Test primary router platform root
        run: tofu -chdir=platform/primary-router test

      - name: Verify primary router production-like values
        run: platform/primary-router/scripts/verify-example.py

      - name: Initialize secondary DNS platform root
        run: tofu -chdir=platform/secondary-dns init -backend=false -input=false

      - name: Test secondary DNS platform root
        run: tofu -chdir=platform/secondary-dns test

      - name: Verify secondary DNS rendered configuration
        run: python platform/secondary-dns/scripts/verify-render.py

      - name: Initialize Caddy reverse proxy module
        run: tofu -chdir=modules/caddy-reverse-proxy init -backend=false -input=false

      - name: Test Caddy reverse proxy module
        run: tofu -chdir=modules/caddy-reverse-proxy test

      - name: Initialize Caddy edge ingress module
        run: tofu -chdir=modules/caddy-edge-ingress init -backend=false -input=false

      - name: Test Caddy edge ingress module
        run: tofu -chdir=modules/caddy-edge-ingress test

      - name: Initialize Caddy deployment example
        run: tofu -chdir=examples/caddy-deployment init -backend=false -input=false

      - name: Test Caddy deployment example
        run: tofu -chdir=examples/caddy-deployment test
